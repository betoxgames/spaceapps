name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  package:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: offline-build
          path: dist
      - name: Package verified offline build
        run: node scripts/package-release.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=(--draft --verify-tag --generate-notes --title "Space Papers $RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${args[@]}" \
            "release/$RELEASE_TAG/Space-Papers-$RELEASE_TAG.html" \
            "release/$RELEASE_TAG/SHA256SUMS" \
            "release/$RELEASE_TAG/release.json"
